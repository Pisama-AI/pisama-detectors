name: Publish to PyPI

on:
  push:
    tags:
      - "pisama-detectors-v*"

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify release tag is current main
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(
            python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])"
          )"
          EXPECTED_TAG="pisama-detectors-v${PACKAGE_VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}." >&2
            exit 1
          fi

          git fetch --no-tags --force --depth=1 origin \
            "+refs/heads/main:refs/remotes/origin/main"
          TAG_COMMIT="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          MAIN_COMMIT="$(git rev-parse "refs/remotes/origin/main^{commit}")"
          if [[ "${TAG_COMMIT}" != "${MAIN_COMMIT}" ]]; then
            echo "Release tag points to ${TAG_COMMIT}, but current origin/main is ${MAIN_COMMIT}." >&2
            exit 1
          fi

      - name: Install build tools
        run: pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pisama-detectors/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Recheck release tag is current main
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags --force --depth=1 origin \
            "+refs/heads/main:refs/remotes/origin/main"
          TAG_COMMIT="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          MAIN_COMMIT="$(git rev-parse "refs/remotes/origin/main^{commit}")"
          if [[ "${TAG_COMMIT}" != "${MAIN_COMMIT}" ]]; then
            echo "Release tag points to ${TAG_COMMIT}, but current origin/main is ${MAIN_COMMIT}." >&2
            exit 1
          fi

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
