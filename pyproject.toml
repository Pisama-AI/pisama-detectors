[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pisama-detectors"
version = "0.3.1"
description = "42 failure detectors for LLM agent systems"
readme = "README.md"
license = {text = "BSL-1.1"}
requires-python = ">=3.10"
authors = [
    { name = "Pisama Team", email = "team@pisama.ai" }
]
keywords = [
    "ai", "agents", "testing", "failure-detection",
    "hallucination", "prompt-injection", "loop-detection",
    "multi-agent", "observability"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.2.6",
    "tiktoken>=0.13.0",
]

[project.optional-dependencies]
semantic = [
    "scikit-learn>=1.7.2",
    "sentence-transformers>=5.6.1",
]
full = [
    "anthropic>=0.120.0",
    "scikit-learn>=1.7.2",
    "sentence-transformers>=5.6.1",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
]

[project.urls]
Homepage = "https://pisama.ai"
Documentation = "https://docs.pisama.ai/detectors"
Repository = "https://github.com/Pisama-AI/pisama-detectors"
Issues = "https://github.com/Pisama-AI/pisama-detectors/issues"
Changelog = "https://github.com/Pisama-AI/pisama-detectors/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pisama_detectors"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/pisama_detectors/detection/completion.py" = ["E402"]
"src/pisama_detectors/detection/context_pressure.py" = ["E402"]
"src/pisama_detectors/detection/convergence.py" = ["E402"]
"src/pisama_detectors/detection/corruption.py" = ["E402"]
"src/pisama_detectors/detection/openclaw/elevated_risk_detector.py" = ["E402"]
"src/pisama_detectors/detection/specification.py" = ["E402"]
"src/pisama_detectors/detection/withholding.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = [
    "src/pisama_detectors",
    "typing_tests/public_api.py",
]
exclude = ["src/pisama_detectors/detection/turn_aware/"]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true

[tool.coverage.run]
source = ["pisama_detectors"]

[tool.coverage.report]
show_missing = true
